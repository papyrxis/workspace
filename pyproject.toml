[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrxis-workspace"
version = "0.5.1"
description = "A reusable, YAML-configured LaTeX publishing workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
px = "px.cli:main"

[tool.setuptools]
packages = ["px", "px.data", "px.data.csl"]

[tool.setuptools.package-data]
"px.data.csl" = ["*.csl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.data-files]
"share/papyrxis-workspace/common/components" = ["common/components/*.tex"]
"share/papyrxis-workspace/common/components/commands" = ["common/components/commands/*.tex"]
"share/papyrxis-workspace/common/packages" = ["common/packages/*.tex"]
"share/papyrxis-workspace/common/presets/book" = ["common/presets/book/*.tex"]
"share/papyrxis-workspace/common/presets/article" = ["common/presets/article/*.tex"]
