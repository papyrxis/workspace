name: Publish Workspace Docker images

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: papyrxis/workspace

jobs:
  publish-ghcr:
    name: Build and publish GHCR image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.event.release.tag_name || github.ref_name, '-') }}
            type=raw,value=sha-${{ github.sha }}
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-dockerhub:
    name: Build and publish Docker Hub image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Skip when Docker Hub credentials are not configured
        if: env.DOCKERHUB_USERNAME == ''
        run: echo "Docker Hub publishing skipped; configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN."
      - name: Set up QEMU
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker metadata
        if: env.DOCKERHUB_USERNAME != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/papyrxis-workspace
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.event.release.tag_name || github.ref_name, '-') }}
            type=raw,value=sha-${{ github.sha }}
      - name: Build and push multi-platform image
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
