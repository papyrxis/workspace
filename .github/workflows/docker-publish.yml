name: Publish Workspace Docker images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: workspace-docker-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: papyrxis/workspace

jobs:
  publish:
    name: Build and publish OCI images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve dependency cache key
        id: cache
        run: |
          set -euo pipefail
          key="$(sha256sum .ci/locks/docker-python.lock | cut -c1-16)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Build the native platform once, load that exact image, and smoke-test it.
      # The smoke cache is separate so this export cannot replace the full
      # multi-platform publishing cache.
      - name: Build cached amd64 smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: papyrxis-workspace:smoke
          cache-from: |
            type=gha,scope=buildkit
            type=gha,scope=workspace-publish-${{ steps.cache.outputs.key }}
            type=gha,scope=workspace-smoke-${{ steps.cache.outputs.key }}
          cache-to: type=gha,scope=workspace-smoke-${{ steps.cache.outputs.key }},mode=max

      - name: Run image, native logger and LaTeX end-to-end smoke tests
        run: bash scripts/docker-smoke.sh papyrxis-workspace:smoke --no-build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: GHCR metadata
        id: ghcr
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.event.release.tag_name || github.ref_name, '-') }}
            type=raw,value=sha-${{ github.sha }}

      - name: Docker Hub metadata
        id: dockerhub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/papyrxis-workspace
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.event.release.tag_name || github.ref_name, '-') }}
            type=raw,value=sha-${{ github.sha }}

      - uses: docker/setup-qemu-action@v3

      # One multi-platform build publishes the same image manifest to both
      # registries. The explicit scope is stable across tags and has a lock-derived
      # namespace, so unchanged dependencies reuse the previous BuildKit layers.
      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ghcr.outputs.tags }}
            ${{ steps.dockerhub.outputs.tags }}
          labels: ${{ steps.ghcr.outputs.labels }}
          cache-from: |
            type=gha,scope=buildkit
            type=gha,scope=workspace-publish-${{ steps.cache.outputs.key }}
            type=gha,scope=workspace-smoke-${{ steps.cache.outputs.key }}
          cache-to: type=gha,scope=workspace-publish-${{ steps.cache.outputs.key }},mode=max
          provenance: true
          sbom: true
