# workspace.yml — full reference
# Copy and adjust for your project.
# Run "make sync" after any changes here.

project:
  type: book          # book | article
  title: "My Book"
  author: "Your Name"
  email: "you@example.com"
  url: "https://github.com/user/repo"

build:
  engine: pdflatex    # pdflatex | xelatex | lualatex
  bibtex: biber
  output_dir: build
  source: main.tex    # default entry point; change for volumes

version:
  source: git         # reads from git tags
  fallback: "dev"

# ── Components ────────────────────────────────────────────────
# For books, the defaults are already sensible.
# You can list explicitly to control order or reduce size.
components:
  - fonts
  - math
  - graphics
  - tables
  - hyperref
  - colors
  - layout
  - titles
  - pagestyles     # remove for articles
  - env
  - index          # remove for articles
  - bibliography
  - code
  - boxes
  - commands/base

# ── Frontmatter (books only) ──────────────────────────────────
frontmatter:
  - cover
  - title
  - copyright
  - preface
  - introduction

# ── Colors ───────────────────────────────────────────────────
colors:
  scheme: technical   # technical | academic

# ── Copyright ─────────────────────────────────────────────────
copyright:
  type: cc-by-sa      # cc-by-sa | cc-by | cc-by-nc | mit | none
  year: "auto"
  holder: "Your Name"

# ── Cover (books only) ────────────────────────────────────────
cover:
  type: generated     # generated | pdf | none
  generated:
    style: modern     # modern | classic | minimal

# ── Overrides ─────────────────────────────────────────────────
# Place your custom .tex files in the directory below.
# Any file matching a component name replaces that component.
# Files not matching any component are appended at the end.
#
# mode: replace (default) — your file replaces the default
# mode: extend            — default first, your additions appended
overrides:
  dir: "configs"
  mode: replace
